<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthleteAI — Reset Password</title>
<link rel="stylesheet" href="styles/login.css">
<style>
  .reset-card {
    width: 100%; max-width: 420px;
    margin: auto;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-2xl);
    padding: var(--sp-10);
    box-shadow: var(--shadow-lg);
  }
  body { justify-content: center; align-items: center; }
  .success-box {
    background: var(--color-success-s);
    border: 1px solid rgba(22,163,74,0.2);
    border-radius: var(--radius-md); padding: var(--sp-3) var(--sp-4);
    font-size: 0.875rem; color: var(--color-success);
    margin-bottom: var(--sp-4); display: none;
  }
  .back-link {
    display: block; text-align: center;
    margin-top: var(--sp-5); font-size: 0.875rem;
    color: var(--color-text-3); text-decoration: none;
  }
  .back-link a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="reset-card">
  <div class="role-indicator athlete" style="margin-bottom:var(--sp-5)">
    <span class="indicator-dot"></span>
    <span>RESET PASSWORD</span>
  </div>

  <div class="form-title">Set New Password</div>
  <p class="form-sub" style="margin-bottom:var(--sp-5)">Enter your new password below.</p>

  <div class="error-msg" id="error-msg"></div>
  <div class="success-box" id="success-msg"></div>

  <div class="form-group">
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleReset()">
  </div>
  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')handleReset()">
  </div>

  <button class="submit-btn athlete-btn" id="submit-btn" onclick="handleReset()">
    Reset Password →
  </button>

  <p class="back-link">Remembered it? <a href="login.html">Back to Sign In</a></p>
</div>

<script>
const API = 'http://localhost:8000/api';

function getToken() {
  return new URLSearchParams(window.location.search).get('token');
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}

function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}

async function handleReset() {
  const token = getToken();
  if (!token) return showError('Invalid or missing reset token. Please request a new link.');

  const newPass = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;

  if (!newPass || newPass.length < 6) return showError('Password must be at least 6 characters.');
  if (newPass !== confirm) return showError('Passwords do not match.');

  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Resetting...'; btn.disabled = true;

  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: newPass })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Reset failed');

    showSuccess('Password reset successfully! Redirecting to login...');
    setTimeout(() => window.location.href = 'login.html', 2000);
  } catch (e) {
    showError(e.message);
    btn.textContent = 'Reset Password →'; btn.disabled = false;
  }
}

// Warn if no token present on load
window.addEventListener('load', () => {
  if (!getToken()) showError('Invalid or missing reset token. Please request a new link.');
});
</script>
</body>
</html>
